<section class="sitewide-contact" aria-labelledby="sitewide-contact-title">
  <div class="container sitewide-contact-grid">
    <div class="sitewide-contact-copy">
      <p class="eyebrow">Start a conversation</p>
      <h2 id="sitewide-contact-title">How would you like to join the mission?</h2>
      <p>Tell us about your church, ministry, community, or interest in The Global Co-Mission. Our team will review your message and follow up.</p>
      <div class="sitewide-contact-direct"><a href="mailto:connect@gcom.world">connect@gcom.world</a><a href="tel:+17274043434">+1 (727) 404-3434</a></div>
    </div>
    <form class="contact-form" data-contact-form novalidate>
      <div class="honeypot" hidden aria-hidden="true"><label for="company-website">Leave this field empty</label><input id="company-website" name="company_website" type="text" tabindex="-1" autocomplete="off"></div>
      <div class="form-field"><label for="contact-name">Name *</label><input id="contact-name" name="name" type="text" autocomplete="name" required></div>
      <div class="form-field"><label for="contact-email">Email *</label><input id="contact-email" name="email" type="email" autocomplete="email" required></div>
      <div class="form-field"><label for="contact-phone">Phone</label><input id="contact-phone" name="phone" type="tel" autocomplete="tel"></div>
      <div class="form-field"><label for="contact-organization">Church or organization</label><input id="contact-organization" name="organization" type="text" autocomplete="organization"></div>
      <div class="form-field"><label for="contact-country">Country or city</label><input id="contact-country" name="location" type="text" autocomplete="country-name"></div>
      <div class="form-field"><label for="contact-interest">I’m interested in</label><select id="contact-interest" name="interest"><option value="">Select one</option><option>Church partnership</option><option>Campaign or city inquiry</option><option>Prayer and ministry updates</option><option>Volunteering</option><option>Giving</option><option>Media or speaking inquiry</option><option>General question</option></select></div>
      <div class="form-field full"><label for="contact-message">Message *</label><textarea id="contact-message" name="message" required placeholder="Tell us a little about how you would like to connect."></textarea></div>
      <div class="form-actions"><button class="button button-dark" type="submit">Send message</button><p class="form-status" data-form-status aria-live="polite"></p></div>
    </form>
  </div>
</section>
